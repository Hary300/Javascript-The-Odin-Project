<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS + CSS Clock</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <div class="clock">
      <div class="clock-face">
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
        <div class="vertical-line"></div>
      </div>
    </div>

    <style>
      html {
        background: #018ded url(https://unsplash.it/1500/1000?image=881&blur=5);
        background-size: cover;
        font-family: 'helvetica neue';
        text-align: center;
        font-size: 10px;
      }

      body {
        margin: 0;
        font-size: 2rem;
        display: flex;
        flex: 1;
        min-height: 100vh;
        align-items: center;
      }

      .clock {
        width: 30rem;
        height: 30rem;
        border: 20px solid white;
        border-radius: 50%;
        margin: 50px auto;
        position: relative;
        padding: 2rem;
        box-shadow:
          0 0 0 4px rgba(0, 0, 0, 0.1),
          inset 0 0 0 3px #efefef,
          inset 0 0 10px black,
          0 0 10px rgba(0, 0, 0, 0.2);
      }

      .clock-face {
        position: relative;
        width: 100%;
        height: 100%;
        transform: translateY(
          -3px
        ); /* account for the height of the clock hands */
      }

      .hand {
        border-radius: 10px;
        width: 6px;
        background: black;
        position: absolute;
        left: 50%;
        bottom: 50%;
        transform-origin: center calc(100% - 3px);
      }

      .second-hand {
        background-color: red;
        height: 50%;
      }

      .min-hand {
        height: 50%;
      }

      .hour-hand {
        height: 30%;
      }

      /* .vertical-line {
        height: 100%;
        width: 6px;
        position: absolute;
        background-color: green;
        left: 50%;
        transform: translateX(-50%);
      } */
    </style>

    <script>
      const hourHand = document.querySelector('.hour-hand');
      const minHand = document.querySelector('.min-hand');
      const secondHand = document.querySelector('.second-hand');

      const fullRotationInDeg = 360;
      const degPerMinOrPerSecond = fullRotationInDeg / 60; // 6
      const degPerHour = fullRotationInDeg / 12; // 30
      const degPerMinuteForHourHand = degPerHour / 60; // Degrees per minute for the hour hand

      function updateClock() {
        const today = Date.now();
        const date = new Date(today);

        const degHourHand =
          (date.getHours() % 12) * degPerHour +
          date.getMinutes() * degPerMinuteForHourHand;
        const degMinHand = date.getMinutes() * degPerMinOrPerSecond;
        const degSecondHand = date.getSeconds() * degPerMinOrPerSecond;

        hourHand.style.rotate = `${degHourHand}deg`;
        minHand.style.rotate = `${degMinHand}deg`;
        secondHand.style.rotate = `${degSecondHand}deg`;
      }

      setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
</html>
