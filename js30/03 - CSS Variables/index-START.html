<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scoped CSS Variables and JS</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <h2>Update CSS Variables with <span class="hl">JS</span></h2>

    <div class="controls">
      <label for="spacing">Spacing:</label>
      <input
        id="spacing"
        type="range"
        name="spacing"
        min="10"
        max="200"
        value="10"
        data-sizing="px"
      />

      <label for="blur">Blur:</label>
      <input
        id="blur"
        type="range"
        name="blur"
        min="0"
        max="25"
        value="10"
        data-sizing="px"
      />

      <label for="base">Base Color</label>
      <input id="base" type="color" name="base" value="#ffc600" />
    </div>

    <img src="https://unsplash.it/800/500?image" width="800" height="500" />

    <style>
      /*
      misc styles, nothing to do with CSS variables
    */

      body {
        text-align: center;
        background: #193549;
        color: white;
        font-family: 'helvetica neue', sans-serif;
        font-weight: 100;
        font-size: 50px;
      }

      .controls {
        margin-bottom: 50px;
      }

      input {
        width: 100px;
      }
    </style>

    <script>
      const spacingElement = document.getElementById('spacing');
      const blurElement = document.getElementById('blur');
      const colorBaseElement = document.getElementById('base');
      const imgElement = document.querySelector('img');
      const inputElements = document.querySelectorAll('input');

      inputElements.forEach((inputElement) => {
        inputElement.addEventListener('input', changeStyle);
      });

      function changeStyle() {
        const spacingValue = spacingElement.value;
        const blurValue = blurElement.value;
        const colorValue = colorBaseElement.value;

        imgElement.setAttribute(
          'style',
          `padding: ${spacingValue}px; background-color: ${colorValue}; filter: blur(${blurValue}px)`
        );
      }

      changeStyle();
    </script>
  </body>
</html>
